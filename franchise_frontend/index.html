<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ✅ Favicon & Branding -->
  <link rel="icon" href="/brandLogo.jpg" type="image/jpeg" />

  <!-- ✅ Preload Key Assets -->
  <link rel="preload" href="/logo.webp" as="image" />
  <link rel="preload" href="/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ✅ Mobile Friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ Primary SEO -->
  <title>Food & Beverage | Mr Franchise</title>
  <meta name="description" content="Discover top food and beverage franchises. Join successful brands and grow your business with Mr Franchise." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.mrfranchise.in/" />

  <!-- ✅ Open Graph (Facebook, WhatsApp, LinkedIn, IG Stories) -->
  <meta property="og:title" content="Food & Beverage | Mr Franchise" />
  <meta property="og:description" content="Discover top food and beverage franchises. Join successful brands and grow your business with Mr Franchise." />
  <meta property="og:image" content="https://www.mrfranchise.in/logo-image.jpg" />
  <meta property="og:url" content="https://www.mrfranchise.in/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mr Franchise" />

  <!-- ✅ Ensure correct image preview -->
  <meta name="image" content="https://www.mrfranchise.in/logo-image.jpg" />

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Food & Beverage | Mr Franchise" />
  <meta name="twitter:description" content="Join top food and beverage franchises today." />
  <meta name="twitter:image" content="https://www.mrfranchise.in/logo-image.jpg" />

  <!-- ✅ Structured Data (SEO + Social Consistency) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Mr Franchise",
    "url": "https://www.mrfranchise.in",
    "logo": "https://www.mrfranchise.in/logo-image.jpg",
    "sameAs": [
      "https://www.facebook.com/yourpage",
      "https://www.instagram.com/yourpage",
      "https://twitter.com/yourpage",
      "https://www.linkedin.com/company/yourpage"
    ]
  }
  </script>
</head>
<body>
  <div id="root">
    <noscript>Please enable JavaScript to view the site.</noscript>
  </div>

  <!-- ✅ Entry Script for Vite -->
  <script type="module" src="/src/main.jsx" defer></script>

  <!-- ✅ Optional SDKs -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v17.0"></script>
  <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
